
services:
  postgres:
    image: postgres:16
    container_name: freshness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshness_db
      POSTGRES_USER: akshay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akshay -d freshness_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: